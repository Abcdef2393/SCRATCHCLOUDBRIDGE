name: Deploy to Firebase Hosting on Push
on:
  push:
    branches:
      - main # Change this to master if your main branch is named master

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Installs your package.json dependencies and builds your project
      - run: npm ci && npm run build 

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SCRATCHCLOUDTEST }} # Make sure MYPROJECT matches your GitHub secret name
          channelId: live